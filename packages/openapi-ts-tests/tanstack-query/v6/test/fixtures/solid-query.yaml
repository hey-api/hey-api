openapi: 3.1.1
info:
  title: Solid Query compatibility
  version: '1.0'
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: A page of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: addPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/ApiError'
  /pets/{petId}:
    get:
      operationId: getPet
      tags: [pets]
      parameters:
        - in: path
          name: petId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          $ref: '#/components/responses/ApiError'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    ApiError:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    ApiError:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
