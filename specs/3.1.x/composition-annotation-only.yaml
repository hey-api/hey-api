openapi: 3.1.0
info:
  title: composition-annotation-only
  version: 1.0.0
paths:
  /things:
    get:
      operationId: getThings
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/things'
                  - description: A collection of things.
components:
  schemas:
    things:
      type: object
      properties:
        totalCount:
          type: integer
          format: int64
    described:
      allOf:
        - $ref: '#/components/schemas/things'
        - description: Things described by an annotation-only member.
    overridden:
      description: Things described by the composition itself.
      allOf:
        - $ref: '#/components/schemas/things'
        - description: Ignored, the composition has its own description.
