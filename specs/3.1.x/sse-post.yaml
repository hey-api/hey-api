openapi: 3.1.0
info:
  title: SSE POST test
  version: 1.0.0
paths:
  /events:
    post:
      operationId: createEvent
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
  /events/subscribe:
    post:
      operationId: subscribeToEventStream
      summary: Subscribe to event stream
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: object
  /events/list:
    get:
      operationId: listEvents
      summary: List events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
