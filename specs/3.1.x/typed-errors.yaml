openapi: 3.1.0
info:
  title: Typed errors
  version: 1.0.0
paths:
  /things:
    get:
      operationId: listThings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerProblem'
  /things/{id}:
    get:
      operationId: getThing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
  /widgets:
    post:
      operationId: createWidget
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '409':
          description: Conflict, no body
        '422':
          description: Validation failed, returned as plain text
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Thing:
      type: object
      required:
        - id
        - count
      properties:
        id:
          type: string
        count:
          type: integer
    Widget:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
    NotFoundProblem:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ServerProblem:
      type: object
      required:
        - code
        - traceId
      properties:
        code:
          type: string
        traceId:
          type: string
